
{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mot de passe modifié — DIRAGENDA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #16283D;
            font-family: Arial, Helvetica, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 12px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.20);
        }

        .success-icon {
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 10px;
            color: #16283D;
            font-size: 23px;
        }

        .message {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .btn-primary {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border-radius: 7px;
            background: #C98A2C;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #b57922;
        }

        .footer {
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="success-icon">

        <svg width="58" height="58" viewBox="0 0 24 24"
             fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <circle cx="12" cy="12" r="9"
                    stroke="#C98A2C"
                    stroke-width="1.8"/>

            <path d="M8 12.5L10.5 15L16 9.5"
                  stroke="#C98A2C"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

        </svg>

    </div>

    <h1>Mot de passe modifié</h1>

    <p class="message">
        Votre mot de passe a été réinitialisé avec succès.
        Vous pouvez maintenant vous connecter à votre compte DIRAGENDA.
    </p>

    <a href="{% url 'login' %}" class="btn-primary">
        Se connecter
    </a>

    <div class="footer">
        DIRAGENDA — Agenda de la direction
    </div>

</div>

</body>
</html>
