
{% extends "base.html" %}

{% block title %}Mot de passe modifié - DIRAGENDA{% endblock %}

{% block content %}

<div
    class="card"
    style="
        max-width: 480px;
        text-align: center;
        padding: 40px;
        margin: 40px auto;
    "
>

    <!-- Icône de confirmation -->
    <div
        style="
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #EAF6EE;
            color: #5CB85C;
            display: flex;
            align-items: center;
            justify-content: center;
        "
    >

        <svg
            width="34"
            height="34"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M20 6L9 17l-5-5"></path>
        </svg>

    </div>


    <!-- Titre -->
    <h2
        style="
            margin: 0 0 10px;
            color: #16283D;
        "
    >
        Mot de passe modifié
    </h2>


    <!-- Message -->
    <p
        style="
            color: #64748B;
            margin: 0 0 24px;
            line-height: 1.6;
        "
    >
        Votre mot de passe a été mis à jour avec succès.
    </p>


    <!-- Bouton retour -->
    <a
        href="{% url 'parametres' %}"
        class="btn"
        style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        "
    >

        <!-- Icône retour -->
        <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>

        Retour aux paramètres

    </a>

</div>

{% endblock %}
